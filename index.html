<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<!-- UI_VERSION=76 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead SLA Monitor</title>
<style>
:root{
  /* surfaces and text */
  --bg:#ECEFF5; --card:#F8F9FC; --panel:#F8F9FC; --panel2:#EDF0F6; --line:#D9DFEA; --track:#DFE4EE;
  --ink:#1C2433; --muted:#5A6478; --faint:#8C95A8;
  /* the brand colour */
  --brand:#0B807C; --brand-ink:#075E5B; --brand-soft:#DCF0EE; --onbrand:#F4FBFA;
  /* sidebar and summary card */
  --side1:#1F2538; --side2:#181D2E; --sidetx:#AEB6CC; --sidehi:#F5F7FC; --mark:#14B8B2;
  --hero1:#0A4B49; --hero2:#0B807C; --ring:#FBBF24; --herotx:#DFF5F2;
  /* status colours: text, soft background, strong */
  --done:#1B7F55; --done-bg:#DDF1E6; --done-s:#3FAE7B;
  --prog:#6A4BB4; --prog-bg:#EAE3F8; --prog-s:#A38BDD;
  --wait:#8F6110; --wait-bg:#FBEDC8; --wait-s:#E4B243;
  --late:#B03A4A; --late-bg:#FADEE0; --late-s:#E5808B;
  --unk:#66707F; --unk-bg:#E7EAF0; --unk-s:#AEB6C4;
  --exc:#B25618; --exc-bg:#FBE5D0; --exc-s:#E7975A;
  --gold-soft:#FBEBC6;
  --side:#1F2538; --shadow:0 1px 2px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.07);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--brand-ink);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hidden{display:none!important}
h1,h2,h3,h4{margin:0}
.muted{color:var(--muted)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px}
.brand{display:flex;gap:12px;align-items:center;padding:2px 8px 22px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#7b95ea,#5cb9c3);display:grid;place-items:center;color:var(--onbrand);font-weight:800;font-size:18px;flex:none}
.brand b{display:block;font-size:15.5px;line-height:1.15}
.brand small{color:var(--muted);font-size:12px}
.sidenav{display:flex;flex-direction:column;gap:4px}
.navitem{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:11px 13px;border-radius:11px;color:var(--muted);font-weight:650;text-align:left}
.navitem svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navitem:hover{background:#e6ecf9;color:var(--ink)}
.navitem[aria-selected="true"]{background:var(--panel);color:var(--brand-ink);box-shadow:var(--shadow)}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:8px}
.who{font-size:12.5px;color:var(--muted);min-width:0}
.who b{display:block;color:var(--ink);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role{display:inline-block;margin-top:4px;padding:2px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand-ink);font-weight:700;font-size:11.5px}
.content{min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:26px 34px 6px}
.top h1{font-size:25px;letter-spacing:-.02em;line-height:1.2}
.top p{margin:3px 0 0;color:var(--muted)}
.topact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:999px;font-size:12.5px;color:var(--muted)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--done-s)}
main{padding:14px 34px 64px}

/* ---------- controls ---------- */
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 15px;border-radius:10px;font-weight:650;font-size:13.5px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.btn.primary:hover{background:var(--brand-ink)}
.btn.sm{padding:5px 12px;font-size:12.5px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.search,.select{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:13.5px}
.search{min-width:220px}
.dctl .search{min-width:280px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:8px;color:var(--muted);font-weight:650}
.seg button[aria-selected="true"]{background:var(--panel);color:var(--brand-ink);box-shadow:var(--shadow)}
.fchip{border:1px solid var(--line);background:var(--panel);padding:6px 13px;border-radius:999px;font-size:13px;color:var(--muted)}
.fchip b{margin-left:6px;color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 16px}
.toolbar .sp{flex:1}

/* ---------- surfaces ---------- */
.panel,.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.note{padding:14px 18px;margin-bottom:14px}
.note.err{background:var(--late-bg);border-color:var(--late-s);color:var(--late);font-weight:650}
.syncbar{display:flex;align-items:center;gap:10px;background:var(--brand-soft);border:1px solid var(--brand);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.syncbar.err{background:var(--late-bg);border-color:var(--late-s)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--brand);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:38px;text-align:center;color:var(--muted)}
.hint{color:var(--muted);font-size:13px}
.help{padding:18px 22px;margin-bottom:14px}
.help h3{font-size:15px;margin-bottom:8px}
.help ul{margin:0;padding-left:18px;color:var(--muted)} .help li{margin:3px 0} .help b{color:var(--ink)}

/* ---------- overview: summary ---------- */
.hero{display:grid;grid-template-columns:minmax(340px,27%) minmax(0,1fr);gap:16px;margin-bottom:18px}
.overall{display:flex;align-items:center;gap:22px;padding:22px 24px}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring b{font-size:30px;letter-spacing:-.02em;line-height:1}
.ring span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.ovbar{display:none;flex:1;min-width:240px}
.legend.inline{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px}
.legend.inline li{white-space:nowrap}
.legend.inline li b{margin-left:4px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.overall h2{font-size:19px;line-height:1.3;margin:4px 0 4px;letter-spacing:-.01em}
.overall p{margin:0;color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:15px 16px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.kpi:hover{transform:translateY(-2px);border-color:var(--brand)}
.kpi[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.khead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.kic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--cb);color:var(--ct)}
.kp{font-size:12px;font-weight:700;color:var(--muted)}
.kn{font-size:30px;font-weight:750;letter-spacing:-.02em;line-height:1.05}
.kl{font-weight:700}
.kd{color:var(--muted);font-size:12px;min-height:30px}
.kbar{height:6px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:8px}
.kbar i{display:block;height:100%;background:var(--cs)}
.k-done{--cb:var(--done-bg);--ct:var(--done);--cs:var(--done-s)} .k-prog{--cb:var(--prog-bg);--ct:var(--prog);--cs:var(--prog-s)}
.k-wait{--cb:var(--wait-bg);--ct:var(--wait);--cs:var(--wait-s)} .k-late{--cb:var(--late-bg);--ct:var(--late);--cs:var(--late-s)}
.k-unk{--cb:var(--unk-bg);--ct:var(--unk);--cs:var(--unk-s)}

/* ---------- overview: request list ---------- */
.phead{display:flex;align-items:center;gap:10px;padding:16px 22px 12px}
.phead h3{font-size:16px}
.count{background:var(--brand-soft);color:var(--brand-ink);border-radius:999px;padding:1px 10px;font-weight:700;font-size:12.5px}
.mrow,.mhead{display:grid;grid-template-columns:minmax(230px,2.2fr) 130px 130px minmax(150px,1.5fr) 74px 120px;gap:16px;align-items:center;padding:13px 22px;width:100%;text-align:left}
.mhead{color:var(--faint);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--panel2);border-top:1px solid var(--line);padding-top:9px;padding-bottom:9px}
.mrow{border:0;border-top:1px solid var(--line);background:transparent;border-left:4px solid transparent}
.mrow:hover{background:var(--panel2)}
.mrow.sel{background:var(--brand-soft);border-left-color:var(--brand)}
.mtitle{font-weight:700;line-height:1.35}
.msub{color:var(--muted);font-size:12.5px}
.mc{color:var(--muted);font-size:13px}.mc.strong{color:var(--ink);font-weight:700;font-size:14px}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--track)}
.stack i{display:block;height:100%}
.stack.tall{height:14px}

/* ---------- overview: request detail ---------- */
.detail{margin-top:18px;overflow:hidden}
.dhead{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:22px 24px 14px}
.dhead h2{font-size:20px;letter-spacing:-.01em;line-height:1.3;max-width:900px}
.dmeta{color:var(--muted);margin-top:4px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lp{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 12px;background:var(--panel2);color:var(--ink)}
.lp.bad{border-color:var(--late-s);color:var(--late);background:var(--late-bg)}
.dact{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.sumrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:4px 24px 20px}
.sc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.sct{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.sc .bignum{font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.sc .bignum small{font-size:13px;font-weight:600;color:var(--muted);margin-left:6px}
.legend{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.legend li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.legend li i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.legend li b{color:var(--ink);margin-left:auto}
.mini{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin:8px 0}
.mini i{display:block;height:100%;background:var(--done-s)}
details.miss{margin-top:5px}
details.miss summary{cursor:pointer;color:var(--brand-ink);font-size:12.5px}
details.miss div{margin-top:4px;font-size:12.5px;color:var(--muted)}
.tabhead{display:flex;align-items:center;gap:10px;padding:14px 24px;border-top:1px solid var(--line);background:var(--panel2)}
.tabhead h3{font-size:15px}
.lhead,.lrow{display:grid;grid-template-columns:minmax(200px,1.2fr) 140px minmax(120px,.8fr) minmax(190px,2fr) 112px 120px;gap:14px;align-items:start;padding:13px 24px}
.lhead{color:var(--faint);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-top:1px solid var(--line);padding-top:9px;padding-bottom:9px}
.lrow{border-top:1px solid var(--line)}
.lrow:hover{background:var(--panel2)}
.who2{display:flex;gap:12px;align-items:center;min-width:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:750;font-size:13px;flex:none}
.nm{font-weight:700}.em{color:var(--muted);font-size:12.5px;word-break:break-all}
.ev{color:var(--muted);font-size:13px;word-break:break-word}
.ov{margin-top:4px;font-size:12.5px;color:var(--exc)}
.when{color:var(--muted);font-size:12.5px}
.tag{display:inline-block;margin-left:6px;border-radius:999px;padding:1px 9px;font-size:11.5px;background:var(--wait-bg);color:var(--wait)}
.pr{display:flex;align-items:center;gap:8px}
.pr .mini{flex:1;max-width:130px;margin:0}
.pr span{font-size:12.5px;font-weight:700;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.Responded{background:var(--done-bg);color:var(--done)}
.pill.Prog{background:var(--prog-bg);color:var(--prog)}
.pill.Pending{background:var(--wait-bg);color:var(--wait)}
.pill.Overdue{background:var(--late-bg);color:var(--late)}
.pill.NotVerified{background:var(--unk-bg);color:var(--unk)}
.pill.Excused{background:var(--exc-bg);color:var(--exc)}
.rlistx{max-height:none}

/* by team lead */
.lvh,.lvr{display:grid;grid-template-columns:minmax(240px,1.5fr) repeat(5,80px) minmax(150px,1fr) 30px;gap:12px;padding:13px 24px;align-items:center}
.lvh{color:var(--faint);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--panel2);border-top:1px solid var(--line);padding-top:9px;padding-bottom:9px}
.lvr{border:0;border-top:1px solid var(--line);width:100%;text-align:left;background:transparent}
.lvr:hover{background:var(--panel2)}
.num{text-align:center;font-weight:750}.num.z{color:var(--faint);font-weight:500}
.num.late{color:var(--late)}.num.wait{color:var(--wait)}.num.done{color:var(--done)}.num.prog{color:var(--prog)}
.ld{padding:8px 24px 16px 70px;border-top:1px dashed var(--line);background:var(--panel2)}
.ldi{display:grid;grid-template-columns:1fr 150px minmax(200px,1.5fr);gap:14px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.ldi:last-child{border-bottom:0}

/* ---------- 1:1 and client feedback (shared look) ---------- */
.sum{padding:20px 24px;margin-bottom:16px}
.sum h2{font-size:20px;letter-spacing:-.01em}
.sum p{margin:4px 0 14px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:16px}
.tile{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:14px;text-align:left;display:flex;gap:12px;align-items:flex-start}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;flex:none}
.t-done .ic{background:var(--done-bg);color:var(--done)} .t-prog .ic{background:var(--exc-bg);color:var(--exc)}
.t-wait .ic{background:var(--wait-bg);color:var(--wait)} .t-late .ic{background:var(--late-bg);color:var(--late)} .t-unk .ic{background:var(--unk-bg);color:var(--unk)}
.tile .n{font-size:26px;font-weight:750;line-height:1.1}.tile .l{font-weight:700}.tile .d{color:var(--muted);font-size:12.5px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(640px,1fr));gap:16px;align-items:start}
.clist{display:flex;flex-direction:column;gap:16px}
.card{overflow:hidden;position:relative}
.ch{padding:18px 22px 14px;display:grid;gap:12px}
.t1{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.title{font-size:16.5px;line-height:1.35}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.big{text-align:right;flex:none}.big b{font-size:26px;line-height:1}.big span{display:block;color:var(--muted);font-size:12.5px}
.row2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.counts{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.counts span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.counts b{color:var(--ink)}
.dth,.dtr{display:grid;grid-template-columns:minmax(170px,1.1fr) 130px minmax(220px,2.2fr) 110px 128px;gap:14px;padding:12px 22px;align-items:start}
.dth{background:var(--panel2);color:var(--faint);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-top:1px solid var(--line)}
.dtr{border-top:1px solid var(--line)}.dtr:hover{background:var(--panel2)}
.rlist{max-height:640px;overflow:auto}
.rlist .dth{position:sticky;top:0;z-index:1;border-top:0}
.how{padding:18px 22px;margin-bottom:14px}
.how h3{margin:0 0 10px;font-size:16px}
.how ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.how li{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.how .no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--onbrand);display:grid;place-items:center;font-weight:800;font-size:13px}
.how li b{display:block;margin-bottom:2px}.how .small{color:var(--muted);font-size:13px}.how .rules{margin-top:12px;color:var(--muted);font-size:13.5px}
.dnote{padding:12px 16px;margin-bottom:14px;background:var(--done-bg);border:1px solid var(--done-s);color:var(--done);border-radius:12px;font-weight:650}
.dctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- dialogs ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,51,45,.52);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(540px,100%);padding:24px;box-shadow:0 24px 70px rgba(12,51,45,.34)}
.modal h3{margin:0 0 4px;font-size:18px}
.modal label{display:block;margin:14px 0 6px;color:var(--muted);font-size:13px}
.modal select,.modal textarea,.modal input[type=text],.modal input[type=date]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px;font:inherit}
.modal textarea{min-height:90px;resize:vertical}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.modal .err{color:var(--late);font-size:13px;margin-top:8px}
.switch{position:relative;display:inline-block;width:54px;height:30px;flex:none}
.modal label.switch{display:inline-block;margin:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;inset:0;background:var(--unk-s);border-radius:999px;transition:background .15s;cursor:pointer}
.slider::before{content:"";position:absolute;height:24px;width:24px;left:3px;top:3px;background:var(--panel);border-radius:50%;transition:transform .15s;box-shadow:0 1px 3px rgba(12,51,45,.34)}
.switch input:checked+.slider{background:var(--done-s)}
.switch input:checked+.slider::before{transform:translateX(24px)}
.switch input:focus-visible+.slider{outline:2px solid var(--brand);outline-offset:2px}
.swrow{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin-top:14px}
.swt{font-weight:750;font-size:15px}
.tgl{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 12px 3px 4px;font-weight:650;font-size:12.5px;color:var(--muted);white-space:nowrap}
.tgl .knob{width:22px;height:22px;border-radius:50%;background:var(--unk-s);flex:none}
.tgl:hover{border-color:var(--brand)}
.tgl.on{background:var(--done-bg);border-color:var(--done-s);color:var(--done)}
.tgl.on .knob{background:var(--done-s)}
.rsstep{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.rsstep:first-of-type{border-top:0}
.rsn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
.rsn.ok{background:var(--done-bg);color:var(--done)} .rsn.bad{background:var(--late-bg);color:var(--late)} .rsn.todo{background:var(--unk-bg);color:var(--unk)}
.rsb{flex:1;min-width:0}
.rsb h4{margin:0 0 4px;font-size:15px}
.rsline{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13.5px}
.rsrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.rsrow input[type=text]{flex:1;min-width:220px}

/* ---- team lead cards ---- */
.ocbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 16px}
.ocbar .grow{flex:1}
.ocgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;align-items:start}
.oc{--ac:var(--wait-s);position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s}
.oc::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--ac)}
.oc:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(23,58,51,.07),0 16px 32px rgba(23,58,51,.12);border-color:var(--ac)}
.oc.h-ok{--ac:var(--done-s)} .oc.h-bad{--ac:var(--late-s)} .oc.h-warn{--ac:var(--wait-s)} .oc.h-unk{--ac:var(--unk-s)}
.oc.open{grid-column:1/-1}
.och{display:flex;align-items:center;gap:14px;padding:22px 22px 14px}
.och .av{width:48px;height:48px;font-size:16px}
.ocid{min-width:0;flex:1}
.ocname{font-weight:780;font-size:16.5px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocmail{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.ocring{position:relative;width:62px;height:62px;flex:none}
.ocring svg{width:62px;height:62px;transform:rotate(-90deg)}
.ocring .tr{stroke:var(--track)} .ocring .pg{stroke:var(--ac);transition:stroke-dasharray .5s}
.ocring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.ocstack{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--track);margin:0 22px}
.ocstack i{display:block;height:100%}
.occhips{display:flex;gap:6px;flex-wrap:wrap;padding:14px 22px 2px;min-height:36px}
.ochip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px 3px 9px;font-size:12px;font-weight:700;background:var(--cb);color:var(--ct)}
.ochip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cs)}
.ochip.done{--cb:var(--done-bg);--ct:var(--done);--cs:var(--done-s)} .ochip.due{--cb:var(--wait-bg);--ct:var(--wait);--cs:var(--wait-s)}
.ochip.late{--cb:var(--late-bg);--ct:var(--late);--cs:var(--late-s)} .ochip.proof{--cb:var(--unk-bg);--ct:var(--unk);--cs:var(--unk-s)}
.ochip.exc{--cb:var(--exc-bg);--ct:var(--exc);--cs:var(--exc-s)}
.ocfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 22px 18px}
.ocfoot .meta{color:var(--muted);font-size:12.5px;font-weight:600}
.ocpeople{border-top:1px solid var(--line);background:var(--panel2)}
.ocadd{width:34px;height:32px;padding:0;font-size:16px;line-height:1;display:grid;place-items:center}
.ocpeople .dth{background:transparent}
.oc.open .ocfoot{padding-bottom:14px}
/* ---- Remind all ---- */
.bhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.bhead .select{width:auto!important;flex:1 1 220px;min-width:200px;max-width:100%}
.blist{border:1px solid var(--line);border-radius:12px;background:var(--panel);max-height:330px;overflow:auto;margin-top:12px}
.bsum{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--line);position:sticky;top:0;font-weight:650;font-size:13px}
.modal label.brow,.brow{display:grid;grid-template-columns:22px 38px minmax(140px,1fr) minmax(190px,1.7fr) 150px auto;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);margin:0!important;cursor:pointer;color:var(--ink);font-weight:400;font-size:13.5px}
.brow:last-child{border-bottom:0}
.brow:hover{background:var(--panel2)}
.brow .av{width:34px;height:34px;font-size:12px}
.brow input{width:18px;height:18px}
.bwho b{display:block;font-size:13.5px} .bwho span{color:var(--muted);font-size:12px}
.bit{color:var(--muted);font-size:12.5px;line-height:1.35}
.bit b{color:var(--ink);font-weight:650}
.bbadge{border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:700;background:var(--unk-bg);color:var(--unk);white-space:nowrap}
.bprev{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:13px;max-height:230px;overflow:auto}
.bprog{height:10px;border-radius:999px;background:var(--track);overflow:hidden;margin:12px 0 6px}
.bprog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--done-s));transition:width .3s}
.bres{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.bres:last-child{border-bottom:0}
.bres .pill{flex:none}
@media (max-width:760px){.modal label.brow,.brow{grid-template-columns:22px 34px 1fr auto}.brow .bit,.brow .bbadge{grid-column:3/-1}}

/* ---- who is signed in ---- */
.me{display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 18px 4px 4px;box-shadow:var(--shadow);min-width:0}
.me .av{width:36px;height:36px;font-size:13px}
.me .mt{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.me .mt b{font-size:13.5px;font-weight:780;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .mt small{color:var(--muted);font-size:11.5px;font-weight:650}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:0 0 14px}
.eyebrow .av{width:30px;height:30px;font-size:11.5px}
.eyebrow b{color:var(--ink)}
.who .why{display:block;font-size:11px;line-height:1.35;color:var(--late);margin-top:8px}
.who .mail{display:block;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
@media (max-width:760px){.me .mt small{display:none}.me .mt b{max-width:120px}}

/* ---- preview + my team ---- */
.previewbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--exc-bg);border:1px solid var(--exc-s);color:var(--exc);border-radius:14px;padding:11px 16px;margin-bottom:14px;font-weight:600}
.previewbar b{color:var(--ink)}
.previewbar .btn{margin-left:auto}
.oc.solo{max-width:none}
.oc.solo .och{padding:24px 26px 14px}
.oc.solo .och .av{width:56px;height:56px;font-size:19px}
.oc.solo .ocname{font-size:20px}
.oc.solo .ocmail{font-size:13px}
.oc.solo .ocring{width:70px;height:70px} .oc.solo .ocring svg{width:70px;height:70px} .oc.solo .ocring b{font-size:14.5px}
.oc.solo .ocstack,.oc.solo .occhips{margin-left:26px;margin-right:26px}
.oc.solo .occhips{padding-left:0;padding-right:0}
.oc.solo .ocfoot{padding:10px 26px 16px}
.oc.solo:hover{transform:none}

/* ---- My team / Everyone ---- */
.eyerow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.eyerow .eyebrow{margin:0}
.scopeseg{display:inline-flex;background:var(--track);border-radius:13px;padding:3px;gap:2px}
.scopeseg button{border:0;background:transparent;padding:8px 16px;border-radius:10px;font:inherit;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.scopeseg button b{background:var(--panel2);border-radius:999px;padding:0 8px;font-size:12px;line-height:20px;color:var(--muted)}
.scopeseg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.scopeseg button[aria-pressed="true"] b{background:var(--brand);color:var(--onbrand)}
.scopeseg button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ctrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ctrow:last-child{border-bottom:0}
.ctrow .av{width:34px;height:34px;font-size:12px}
.ctrow .who2{flex:1;min-width:0}
.ctrow .who2 b{display:block;font-size:14px}
.ctrow .who2 span{color:var(--muted);font-size:12.5px}

/* ---- find a person / old rows ---- */
.fpcard{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px 14px;margin-top:10px}
.fpcard .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fpcard .hd b{font-size:14.5px}
.fpcard .hd .pill{margin-left:auto}
.fpcard p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
.fpcard .fix{margin-top:8px;padding:8px 10px;border-radius:9px;background:var(--panel2);font-size:12.5px}
.fprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fprow input{flex:1;min-width:220px}
.oldpill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:700;background:var(--unk-bg);color:var(--unk);margin-left:6px}
.acts{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.acts .btn{white-space:nowrap}
.btn.soft{background:var(--brand-soft);border-color:var(--brand-soft);color:var(--brand-ink)}
.btn.soft:hover{border-color:var(--brand)}
.rem-at{font-size:11.5px;color:var(--muted);line-height:1.3}
#remBtn.on{background:var(--done-bg);border-color:var(--done-s);color:var(--done)}
.notebox{padding:10px 12px;border-radius:10px;margin:12px 0;font-size:13px}
.notebox.warn{background:var(--wait-bg);color:var(--wait);border:1px solid var(--wait-s)}
.notebox.ok{background:var(--done-bg);color:var(--done);border:1px solid var(--done-s)}
.chk{display:flex;align-items:center;gap:8px;margin:14px 0 4px!important;color:var(--ink)!important;font-size:15px!important}
.chk input{width:18px;height:18px}

/* ---------- smaller screens ---------- */

/* request accordion: newest on top, each one opens and closes */
.reqs{overflow:hidden}
.rgrid,.rhead{display:grid;grid-template-columns:28px minmax(230px,2.4fr) 130px minmax(140px,1.4fr) 74px 120px;gap:16px;align-items:center;width:100%}
.rgrid{padding:9px 22px;background:var(--panel2);border-top:1px solid var(--line);color:var(--faint);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.req{border-top:1px solid var(--line)}
.rhead{padding:14px 22px;border:0;background:transparent;text-align:left}
.rhead:hover{background:var(--panel2)}
.req.open>.rhead{background:var(--brand-soft)}
.chev{color:var(--brand-ink);font-size:15px;text-align:center}
.reqbody{border-top:1px solid var(--line);background:var(--panel)}
.dbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:16px 24px 4px}
.dbar .links{margin-top:0}
.tlbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:0}
.tlbtn h3{font-size:15px}
.tlbtn .chev{width:20px}
.tabhead{padding:0}
.tabhead .tlbtn{padding:14px 24px}
.tabhead .tlbtn:hover{background:var(--brand-soft)}
@media (max-width:1500px){
  .rgrid,.rhead{grid-template-columns:28px minmax(220px,2.4fr) minmax(130px,1.4fr) 70px 120px}
  .rgrid>:nth-child(3),.rhead>:nth-child(3){display:none}
}
@media (max-width:1000px){
  .rgrid{display:none}
  .rhead{grid-template-columns:28px 1fr auto;gap:8px 12px}
  .rhead>:nth-child(3),.rhead>:nth-child(4),.rhead>:nth-child(5){display:none}
}
@media (max-width:1500px){
  .mrow,.mhead{grid-template-columns:minmax(220px,2.2fr) 130px minmax(130px,1.4fr) 70px 120px}
  .mrow>:nth-child(2),.mhead>:nth-child(2){display:none}
}
@media (max-width:1440px){
  .hero{grid-template-columns:1fr}
  .overall{padding:18px 24px}
  .ovbar{display:block}
}
@media (max-width:1180px){
  .sumrow{grid-template-columns:1fr}
  .how ol{grid-template-columns:1fr 1fr}
}
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 14px;overflow-x:auto}
  .brand{padding:0 8px 0 0}.brand small{display:none}
  .sidenav{flex-direction:row}.sidefoot{margin:0 0 0 auto}.who{display:none}
  .top,main{padding-left:16px;padding-right:16px}
  .kpis,.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mhead,.lhead,.dth,.lvh{display:none}
  .mrow{grid-template-columns:1fr auto;gap:8px 12px}
  .mrow .mc{display:none}
  .lrow{grid-template-columns:1fr auto;padding:12px 16px}.lrow>:nth-child(n+3){grid-column:1/-1}
  .dtr{grid-template-columns:1fr auto;padding:12px 16px}.dtr .dev,.dtr .dwhen{grid-column:1/-1}
  .lvr{grid-template-columns:1fr auto auto auto auto auto 24px}.lvr .rate{display:none}

}

@media (prefers-reduced-motion:reduce){*{transition:none!important}.spin{animation:none}}

/* ================= Theme layer: clean, flat and professional. Every colour comes from the tokens in :root ================= */
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::selection{background:var(--brand-soft);color:var(--ink)}
html,body{background:var(--bg)}
h1,h2,h3,h4{letter-spacing:-.015em}

/* --- sidebar --- */
.side{background:linear-gradient(180deg,var(--side1),var(--side2));border-right:0}
.brand b{color:var(--sidehi)}.brand small{color:var(--sidetx)}
.logo{background:var(--brand);color:var(--onbrand);box-shadow:none}
.navitem{color:var(--sidetx);transition:background .15s,color .15s}
.navitem:hover{background:rgba(246,247,254,.07);color:var(--sidehi)}
.navitem[aria-selected="true"]{background:rgba(246,247,254,.10);color:var(--sidehi);box-shadow:inset 3px 0 0 var(--mark)}
.who{color:var(--sidetx)}.who b{color:var(--sidehi)}
.role{background:rgba(246,247,254,.12);color:var(--sidehi)}
.sidefoot .btn{background:rgba(246,247,254,.06);border-color:rgba(246,247,254,.16);color:var(--sidehi)}
.sidefoot .btn:hover{background:rgba(246,247,254,.12);border-color:var(--mark)}

/* --- page --- */
.top h1{font-size:26px;font-weight:760;letter-spacing:-.025em}
.chip{background:var(--card);border-color:var(--line);box-shadow:none}
.panel,.box{background:var(--card);border-color:var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(20,30,50,.05)}
.btn{background:var(--card);border-color:var(--line);border-radius:10px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--brand);background:var(--brand-soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--onbrand);box-shadow:none}
.btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
.btn.soft{background:var(--brand-soft);border-color:var(--brand-soft);color:var(--brand-ink)}
.search,.select{background:var(--card);border-radius:10px}
.search:focus,.select:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.seg{background:var(--panel2);border-radius:11px}
.seg button[aria-selected="true"]{background:var(--brand);color:var(--onbrand);box-shadow:none}
.fchip{background:var(--card)}
.fchip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.fchip[aria-pressed="true"] b{color:var(--onbrand)}
.count{background:var(--panel2);color:var(--muted)}
.syncbar{background:var(--brand-soft);border-color:var(--line)}
.note.err,.syncbar.err{background:var(--late-bg);border-color:var(--late-s)}

/* --- summary card --- */
.overall{background:linear-gradient(135deg,var(--hero1),var(--hero2));border-color:transparent;color:var(--sidehi);box-shadow:var(--shadow)}
.overall .kicker{color:var(--herotx)}
.overall h2{color:var(--onbrand)}
.overall p{color:var(--herotx)}
.overall .ring b{color:var(--onbrand)}
.overall .ring span{color:var(--herotx)}
.overall .ring circle:first-child{stroke:rgba(246,247,254,.22)}
.overall .ring circle:last-child{stroke:var(--ring)}
.overall .legend li,.overall .legend{color:var(--herotx)}
.overall .legend b{color:var(--onbrand)}
.overall .hint{color:var(--herotx)}

/* --- numbers: each card carries its status colour on top --- */
.kpi{border-radius:14px;border-top:4px solid var(--cs);background:var(--card);box-shadow:0 1px 2px rgba(20,30,50,.05)}
.kpi:hover{border-color:var(--cs);box-shadow:var(--shadow)}
.kpi[aria-pressed="true"]{background:var(--cb);border-color:var(--cs)}
.kic{border-radius:10px}
.kn{font-weight:800}

/* --- lists and tables --- */
.mhead{background:var(--panel2);color:var(--muted)}
.mrow:hover{background:var(--panel2)}
.mrow.sel{background:var(--brand-soft);border-left-color:var(--brand)}
.dtr:hover{background:var(--panel2)}
.stack,.kbar{background:var(--track)}
.bprog i{background:var(--brand)}

/* --- clickable numbers, the colour bar with its legend, and who has already submitted --- */
button.tile{appearance:none;width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer}
.tile{padding:9px 12px;gap:9px;border-radius:12px;border-top:3px solid var(--ts,var(--line));background:var(--card);box-shadow:0 1px 2px rgba(20,30,50,.05);transition:box-shadow .15s,transform .15s}
.tile:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.t-done{--ts:var(--done-s);--cb:var(--done-bg)} .t-prog{--ts:var(--exc-s);--cb:var(--exc-bg)} .t-wait{--ts:var(--wait-s);--cb:var(--wait-bg)} .t-late{--ts:var(--late-s);--cb:var(--late-bg)} .t-unk{--ts:var(--unk-s);--cb:var(--unk-bg)}
.tile[aria-pressed="true"]{background:var(--cb);border-color:var(--ts);box-shadow:0 0 0 2px var(--ts)}
.tile .ic{border-radius:10px}
.tile .n{font-weight:800;font-size:21px}.tile .d{display:none}.tile .ic{transform:scale(.85)}
.dstack{height:16px;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(20,30,50,.06)}
.dstack .segb{display:block;height:100%;border:0;padding:0;margin:0;cursor:pointer;transition:filter .15s}
.dstack .segb:hover{filter:brightness(1.08) saturate(1.1)}
.dstack .segb.on{box-shadow:inset 0 0 0 3px rgba(246,247,254,.85)}
.dlegend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 2px}
.lg{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;font-size:13px;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.lg i{width:11px;height:11px;border-radius:50%;display:inline-block}
.lg b{margin-left:2px}
.lg:hover{border-color:var(--brand)}
.lg.on{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.lg.on b{color:var(--onbrand)}
.lg.clear{background:var(--gold-soft);border-color:#E9CD86;color:#7A5200;font-weight:700}
.lghint{color:var(--faint);font-size:12.5px;margin-left:4px}
.fbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;margin:0 0 12px;border:1px solid var(--line);background:var(--brand-soft);border-radius:12px;color:var(--brand-ink)}
.upanel{padding:10px 14px 12px;margin-bottom:12px}
.upanel.done{border-top:4px solid var(--done-s)} .upanel.excp{border-top:4px solid var(--exc-s)}
.uphead{display:flex;align-items:center;gap:10px;margin-bottom:8px;width:100%;background:none;border:0;padding:4px 2px;font:inherit;color:inherit;cursor:pointer;text-align:left}
.uphead .chev{margin-left:auto;color:var(--muted)} .upanel.shut .uphead{margin-bottom:0}
.uphead h3{font-size:15px}
.upgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;align-items:start}
.upc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--done-s);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.upc>summary{cursor:pointer;list-style:none;flex-wrap:wrap;align-items:center;gap:4px 8px}.upc>summary::-webkit-details-marker{display:none}
.upc .uppeek{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.upc[open] .uppeek{display:none}
.upc .upbody{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.upc.exc{border-left-color:var(--exc-s)}
.uph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.upc .nm{font-weight:750;font-size:14px}
.upc .em{color:var(--muted);font-size:12.5px}
.upsrc{font-size:12.5px;color:var(--brand-ink);font-weight:650}
.uptx{color:var(--ink);font-size:13.5px;line-height:1.5;overflow-wrap:anywhere}
.uptx.exc{background:var(--exc-bg);border-radius:10px;padding:8px 11px;color:var(--exc)}
.upmore{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.upact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto}
.upfoot{text-align:center;margin-top:12px}
.sect{display:flex;align-items:center;gap:10px;margin:6px 2px 10px}
.sect h3{font-size:16px}

/* --- dialogs --- */
.scrim{backdrop-filter:blur(3px)}
.modal{border-radius:18px;background:var(--card);box-shadow:0 30px 80px rgba(20,30,50,.32)}
.how .no{background:var(--brand)}

.upgrid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))!important;gap:10px!important;align-items:stretch!important}
.upc{padding:11px 14px!important;gap:4px!important;border-radius:12px!important;box-shadow:0 1px 2px rgba(20,30,50,.05);transition:box-shadow .15s,border-color .15s}
.upc:hover{box-shadow:var(--shadow)}
.upc>summary.uph{display:grid!important;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm st" "em st";align-items:center;column-gap:10px;row-gap:2px}
.upc .nm{grid-area:nm;font-size:14.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upc .em{grid-area:em;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upc .stp{grid-area:st;justify-self:end;display:flex}
.upc .stp .pill,.upc .stp>*{white-space:nowrap}
.upc[open]{grid-column:1/-1}
.upc[open]>summary{padding-bottom:6px;border-bottom:1px solid var(--line)}
.upc .uppeek{margin-top:2px}
.uphead{padding:6px 4px!important}
.uphead .count{background:var(--panel2)}
.upanel{padding:12px 16px 14px!important}
.mt{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11.5px;font-weight:650;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.mt.ok{background:var(--done-bg);color:var(--done);border-color:transparent}

.side{background:var(--sbbg);border-right:1px solid var(--sbline)}
.mmlogo{display:block;width:172px;max-width:100%;height:auto;margin:4px 10px 16px}
.brand{padding:12px 10px 20px;margin:0 0 6px;border-top:1px solid var(--sbline)}
.brand b{color:var(--sbhi)}.brand small{color:var(--muted)}
.navitem{color:var(--sbtx)}
.navparent{width:100%}
.howbox{display:grid;grid-template-columns:150px minmax(0,1fr);gap:7px 16px;margin:0 22px 14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);font-size:13.5px;line-height:1.45}
.howbox dt{color:var(--muted);font-weight:650}
.howbox dd{margin:0;color:var(--ink)}
.howbox a{color:var(--brand-ink)}
@media (max-width:700px){.howbox{grid-template-columns:1fr;margin:0 12px 12px}.howbox dt{margin-top:6px}}
.navparent .navchev{width:16px;height:16px;margin-left:auto;transition:transform .15s}
.navparent[aria-expanded="false"] .navchev{transform:rotate(-90deg)}
.navparent[data-active="1"]{color:var(--sbhi)}
.navsubs{display:flex;flex-direction:column;gap:2px;margin:2px 0 6px 22px;padding-left:10px;border-left:1px solid var(--line)}
.navsub{padding:8px 11px;font-size:13.5px;gap:10px}
.navsub .navdot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45;flex:none}
.navsub[aria-selected="true"] .navdot{opacity:1;background:var(--brand)}
.navitem:hover{background:var(--sbhover);color:var(--sbhi)}
.navitem[aria-selected="true"]{background:var(--sbsel);color:var(--sbhi);box-shadow:inset 3px 0 0 var(--brand)}
.who{color:var(--muted)}.who b{color:var(--sbhi)}
.role{background:var(--brand-soft);color:var(--brand-ink)}
.sidefoot .btn{background:var(--card);border-color:var(--line);color:var(--sbhi)}
@media (max-width:1000px){.mmlogo{width:120px;margin:0 8px 0 0}.brand{border-top:0;padding:0 8px 0 0;margin:0}}

/* ---------- Messages view, team and leader filters ---------- */
.orgsel{max-width:220px}
.mbar{display:flex;flex-direction:column;gap:8px;padding:14px 22px 12px;border-bottom:1px solid var(--line)}
.mbar .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mbar .lbl{font-size:12.5px;font-weight:650;color:var(--muted)}
.mbar .select{min-width:200px}
.msg{display:grid;grid-template-columns:120px minmax(170px,230px) minmax(0,1fr) 150px;gap:14px;padding:13px 22px;border-top:1px solid var(--line);align-items:start}
.msg:hover{background:var(--panel2)}
.msg .when{font-size:12.5px}
.msg .who2 .nm{font-size:13.5px}
.msg .tx{font-size:13.5px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
.msg .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:12.5px;color:var(--muted)}
.cat{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:650;white-space:nowrap}
.cat.Request{background:var(--brand-soft);color:var(--brand-ink)}
.cat.Update{background:var(--prog-bg);color:var(--prog)}
.cat.Internet{background:var(--late-bg);color:var(--late)}
.cat.Regular{background:var(--unk-bg);color:var(--unk)}
.teamtag{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:650;color:var(--muted)}
.rqline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--panel2);font-size:12.5px}
.msgacts{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
@media (max-width:1000px){.msg{grid-template-columns:1fr;gap:6px;padding:12px 16px}}

/* ---------- calmer, more professional type scale (about 10% smaller, lighter weights) ---------- */
body{zoom:.9}
.app{min-height:calc(100vh / .9)}
.side{height:calc(100vh / .9)}
.top h1{font-size:24px;font-weight:680;letter-spacing:-.02em}
.brand b,.who b{font-weight:650}
.btn,.chip,.fchip,.navitem{font-weight:600}
.overall h2{font-weight:650}
.tile .n,.sc .bignum,.big b,.upc .nm,.tile .l{font-weight:680}
.upc .nm{font-weight:650}
h3,.sect h3,.uphead h3{font-weight:650}
.nm{font-weight:650}


.navitem .soon,.scard .soon{font-style:normal;font-size:10px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--panel2);color:var(--muted);vertical-align:1px}
.gbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 14px}
.gbar::-webkit-scrollbar{display:none}
.gbar button{flex:none;white-space:nowrap;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sbtx);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.gbar button:hover{border-color:var(--brand)}
.gbar button[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
/* summary */
.sumhead{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 0 16px}
.sumhead .kicker{color:var(--muted);font-size:13px}
.sumhead h2{font-size:20px;font-weight:650;letter-spacing:-.01em;margin-top:2px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.scard{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:var(--card);box-shadow:0 1px 2px rgba(20,30,50,.05);transition:box-shadow .15s,transform .15s,border-color .15s;min-height:190px}
.scard:hover{box-shadow:0 8px 22px rgba(20,30,50,.09);transform:translateY(-1px);border-color:var(--brand)}
.schead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.schead b{font-size:14.5px;font-weight:650}
.sic{width:32px;height:32px;border-radius:10px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.sic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sgo{margin-left:auto;font-size:12.5px;color:var(--brand-ink);opacity:0;transition:opacity .15s;white-space:nowrap}
.scard:hover .sgo,.scard:focus-visible .sgo{opacity:1}
.sbig{font-size:30px;font-weight:680;letter-spacing:-.02em;line-height:1.1}
.sbig small{font-size:16px;font-weight:600;margin-left:1px;color:var(--muted)}
.sbig.muted{color:var(--unk-s)}
.ssub{color:var(--muted);font-size:13px}
.sbar{display:flex;height:6px;border-radius:99px;background:var(--track);overflow:hidden;margin:6px 0 4px}
.sbar i{display:block;height:100%}
.sstats{list-style:none;margin:2px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;font-size:12.5px;color:var(--muted)}
.sstats li{display:flex;align-items:center;gap:7px}
.sstats li i{width:8px;height:8px;border-radius:50%;background:var(--track);flex:none}
.sstats li b{margin-left:auto;color:var(--ink);font-weight:650}
.sfoot{margin-top:auto;padding-top:8px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line)}
/* coming metrics */
.soonnote{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--brand-soft);color:var(--brand-ink);margin-bottom:14px}
.soonnote b{display:block;font-size:14.5px}.soonnote span{font-size:13px;opacity:.9}
.soonnote .sic{background:#fff}
.skpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.skpi{padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.skpi .l{font-size:13px;color:var(--muted);font-weight:600}.skpi .n{font-size:28px;font-weight:680;color:var(--unk-s);margin:2px 0}.skpi .d{font-size:12px;color:var(--muted)}
.stable{padding:0 4px 4px}
.str{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:12px;padding:12px 16px;border-top:1px solid var(--line);font-size:13px}
.sth{font-size:11.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-top:0}
.skl{display:block;height:10px;border-radius:6px;background:var(--track);width:70%}
.str:nth-child(3) .skl{width:55%}.str:nth-child(4) .skl{width:62%}
/* copilot tab */
body.oncp #cpLaunch,body.oncp #cpBox{display:none!important}
.cptab{display:flex;flex-direction:column;height:calc(100vh / .9 - 250px);min-height:460px;overflow:hidden}
.cphead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:linear-gradient(135deg,#0B6E6A,#13A39C);color:#fff}
.cphead b{display:block;font-size:15px}.cphead span{font-size:12px;opacity:.85}
.cphead .btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff}
.cptab .av,.cphead .av{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.18)}
.cptab .av svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cpbd{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.cpwl{max-width:620px;margin:auto;text-align:center}
.cpwl h3{font-size:20px;font-weight:650}.cpwl p{color:var(--muted);margin:6px 0 16px}
.cpsg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cpsg button{font:inherit;font-size:13.5px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.cpsg button:hover{border-color:var(--brand);color:var(--brand-ink)}
.cpm{display:flex;gap:10px;max-width:820px}
.cpm.u{align-self:flex-end}
.cpm.u .bb{background:var(--brand);color:#fff;border-radius:16px 16px 4px 16px}
.cpm.a .av{background:var(--brand-soft);color:var(--brand-ink);width:30px;height:30px;border-radius:9px}
.cpm .bb{padding:10px 14px;border-radius:16px 16px 16px 4px;background:var(--card);border:1px solid var(--line);font-size:14px;line-height:1.55;min-width:0}
.cpm.u .bb{border:0}
.cpm.err .bb{background:var(--late-bg);border-color:transparent;color:var(--late)}
.cpm .bb p{margin:0 0 6px}.cpm .bb p:last-child{margin:0}.cpm .bb ul,.cpm .bb ol{margin:4px 0 6px;padding-left:20px}
.cpm .asof{font-size:11.5px;color:var(--muted);margin-top:6px}
.ty{display:inline-flex;gap:4px}.ty i{width:7px;height:7px;border-radius:50%;background:var(--brand);opacity:.35;animation:tyb 1s infinite}
.ty i:nth-child(2){animation-delay:.15s}.ty i:nth-child(3){animation-delay:.3s}
@keyframes tyb{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.cpft{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line);background:var(--card)}
.cpft textarea{flex:1;resize:none;font:inherit;font-size:14px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);min-height:42px;max-height:120px}
.cpft textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
@media (max-width:760px){
  .sgrid{grid-template-columns:1fr}
  .scard{min-height:0}
  .sgo{opacity:1}
  .skpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stable{overflow-x:auto}.str{min-width:560px}
  .cptab{height:calc(100vh - 210px);min-height:420px}
  .cpsg{grid-template-columns:1fr}
  .cpbd{padding:14px 12px}
  .navitem .soon{display:none}
}

/* ---------- phones and small tablets ---------- */
@media (max-width:1000px){.side{height:auto}.app{min-height:100vh}}
@media (max-width:760px){

/* ---------- v76: Summary ---------- */
.sumhero{margin:0 0 14px}.sumhero .kicker{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.sumhero h2{font-size:24px;font-weight:680;letter-spacing:-.015em;margin-top:2px}
.kstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kt{display:flex;gap:14px;align-items:center;text-align:left;font:inherit;color:inherit;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:var(--card);cursor:pointer;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(20,30,50,.05);transition:transform .15s,box-shadow .15s}
.kt:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(20,30,50,.09)}
.kt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc)}
.kti{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--kb);color:var(--kc);font-weight:800;font-size:18px}
.kti svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ktx b{display:block;font-size:26px;font-weight:720;letter-spacing:-.02em;line-height:1.1}.ktx b small{font-size:15px;color:var(--muted);font-weight:600}
.ktx span{display:block;font-size:13px;font-weight:600;color:var(--sbtx);margin-top:2px}.ktx em{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.kt.k1{--kc:var(--done);--kb:var(--done-bg)}.kt.k2{--kc:var(--late);--kb:var(--late-bg)}.kt.k3{--kc:var(--brand-ink);--kb:var(--brand-soft)}.kt.k4{--kc:#6A4BB4;--kb:#EAE3F8}.kt.k5{--kc:var(--wait);--kb:var(--wait-bg);cursor:default}
.sum2.b{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.sum2.b .attn{margin-bottom:0}
.lreq{list-style:none;margin:0;padding:0}
.lreq li button{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left;border:0;background:transparent;font:inherit;color:inherit;padding:10px 8px;border-radius:10px;cursor:pointer;border-top:1px solid var(--line)}
.lreq li:first-child button{border-top:0}
.lreq li button:hover{background:var(--panel2)}
.lt b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lt span{font-size:12px;color:var(--muted)}
.lb{display:flex;align-items:center;gap:10px}.mtrack.sm{flex:1;height:7px;display:flex;border-radius:99px;background:var(--track);overflow:hidden}.mtrack.sm i{display:block;height:100%}
.lp{font-size:12.5px;font-weight:650;min-width:42px;text-align:right}
.areas{margin-top:16px}
.areas .sph{margin-bottom:10px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.acard{display:flex;flex-direction:column;gap:10px;text-align:left;font:inherit;color:inherit;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);cursor:pointer;box-shadow:0 1px 2px rgba(20,30,50,.05);transition:transform .15s,box-shadow .15s,border-color .15s}
.acard:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(20,30,50,.09);border-color:var(--brand)}
.ach{display:flex;align-items:center;gap:8px}.ach b{font-size:13.5px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ach .ric{width:26px;height:26px;border-radius:8px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center}
.ach em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8F6110;background:#FBEDC8;padding:2px 6px;border-radius:6px}
.acb{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.acn{font-size:26px;font-weight:720;letter-spacing:-.02em;line-height:1}.acn small{font-size:14px;color:var(--muted);font-weight:600}
.acs{font-size:12px;color:var(--muted);margin-top:4px}
.spk{width:120px;height:34px;flex:none}
.acf{font-size:12.5px;color:var(--sbtx);display:flex;gap:6px;align-items:center;border-top:1px dashed var(--line);padding-top:8px}
@media (max-width:1100px){.sum2.b{grid-template-columns:1fr}}
@media (max-width:760px){.kstrip{grid-template-columns:1fr 1fr}.kt{padding:12px}.kti{width:34px;height:34px}.ktx b{font-size:21px}.agrid{grid-template-columns:1fr}}

.acs .dup,.acs .ddn{font-size:11.5px;margin-left:4px}
.acf i{width:6px;height:6px;border-radius:50%;background:var(--brand);flex:none}
.agrid{grid-template-columns:repeat(4,minmax(0,1fr))}
.acard.golive{cursor:default;background:linear-gradient(135deg,var(--brand-soft),var(--card));border-style:dashed}
.acard.golive:hover{transform:none;box-shadow:none;border-color:var(--line)}
.mdue .mdr{width:100%;display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 30px;gap:10px;align-items:center;border:0;background:transparent;font:inherit;font-size:13px;color:var(--sbtx);padding:4px 0;cursor:pointer;text-align:left}
.mdue .mdr span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mdt{height:8px;border-radius:99px;background:var(--track);overflow:hidden}.mdt i{display:block;height:100%;background:var(--wait-s);border-radius:99px}
.mdue .mdr b{text-align:right;color:var(--ink)}
.mdue .mdr:hover span:first-child{color:var(--brand-ink)}
@media (max-width:1300px){.agrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.agrid{grid-template-columns:1fr}}

.sum2>*{min-width:0}.lreq li button,.lt{min-width:0;max-width:100%}.lt{width:100%}
@media (max-width:760px){.alist li .atx{flex-basis:calc(100% - 42px)}.alist li .btn{margin-left:42px}.atx span{white-space:normal}.lt b{white-space:normal}}
</style>
</head>

  /* ---------- by request: newest on top, each request opens and closes ---------- */

  function showRemNote(msg) {

  document.addEventListener('change', function (e) { if (e.target.id === 'dMonth') { state.month = e.target.value; state.dnote = ''; state.dfilter = ''; loadDim(); } });
  document.addEventListener('input', function (e) { if (e.target.id === 'dSearch') { state.dq = e.target.value; renderDimBody(); } });
  $('#dCancel').addEventListener('click', closeDim);
  $('#dSave').addEventListener('click', saveDim);
  $('#dscrim').addEventListener('click', function (e) { if (e.target.id === 'dscrim') closeDim(); });

  load(function () { if (state.data && state.data.codeVersion === UI_VER && state.data.user.tabs.indexOf('sla') !== -1) autoSync(false); });
  setInterval(function () { if (!state.modal && !state.dmodal && !state.syncing) load(); }, 5 * 60 * 1000);
})();
</script>
</body>
</html>
